name: kurvenfunk-dev

services:
  postgres:
    volumes:
      - /srv/kurvenfunk/dev/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - /srv/kurvenfunk/dev/redis:/data

  keycloak:
    ports:
      - "127.0.0.1:3102:8080"

  meilisearch:
    ports:
      - "127.0.0.1:3103:7700"
    volumes:
      - /srv/kurvenfunk/dev/meilisearch:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:7700/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
x-kurvenfunk-environment:
  name: development
  env_file: .env.dev
