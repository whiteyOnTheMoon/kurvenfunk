name: kurvenfunk-dev

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - frontend
      - backend
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    volumes:
      - /srv/kurvenfunk/dev/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - /srv/kurvenfunk/dev/redis:/data

  web:
    ports:
      - '127.0.0.1:3100:3000'

  api:
    environment:
      # DEV shows only authoritative data; synthetic imports run only in isolated CI.
      SPORTS_FAKE_PROVIDER_ENABLED: 'false'
    ports:
      - '127.0.0.1:3101:3000'

  worker:
    environment:
      SPORTS_FAKE_PROVIDER_ENABLED: 'false'
      SPORTS_IMPORT_SCHEDULER_ENABLED: 'false'
      SPORTS_IMPORT_LIVE_ENABLED: 'false'
      SPORTS_IMPORT_FIXTURES_INTERVAL_MS: ${SPORTS_IMPORT_FIXTURES_INTERVAL_MS:-43200000}
      SPORTS_IMPORT_RESULTS_INTERVAL_MS: ${SPORTS_IMPORT_RESULTS_INTERVAL_MS:-900000}
      SPORTS_IMPORT_LIVE_INTERVAL_MS: ${SPORTS_IMPORT_LIVE_INTERVAL_MS:-60000}

  keycloak:
    environment:
      KC_HOSTNAME: https://auth-dev.kurvenfunk.at
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./infrastructure/keycloak/themes/kurvenfunk:/opt/keycloak/themes/kurvenfunk:ro
    ports:
      - '127.0.0.1:3102:8080'

  meilisearch:
    ports:
      - '127.0.0.1:3103:7700'
    volumes:
      - /srv/kurvenfunk/dev/meilisearch:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - /srv/kurvenfunk/dev/minio:/data
    ports:
      - '127.0.0.1:3105:9000'
      - '127.0.0.1:3106:9001'
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: '500'
      MP_DATABASE: /data/mailpit.db
      MP_LABEL: Kurvenfunk DEV
    volumes:
      - /srv/kurvenfunk/dev/mailpit:/data
    ports:
      - '127.0.0.1:3107:8025'
    networks:
      - backend

x-kurvenfunk-environment:
  name: development
  env_file: .env.dev
