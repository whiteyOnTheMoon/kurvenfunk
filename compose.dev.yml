name: kurvenfunk-dev

services:
  postgres:
    volumes:
      - /srv/kurvenfunk/dev/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - /srv/kurvenfunk/dev/redis:/data

  keycloak:
    ports:
      - "127.0.0.1:3102:8080"

x-kurvenfunk-environment:
  name: development
  env_file: .env.dev
