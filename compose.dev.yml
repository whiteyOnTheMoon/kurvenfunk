name: kurvenfunk-dev

services:
  postgres:
    volumes:
      - /srv/kurvenfunk/dev/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - /srv/kurvenfunk/dev/redis:/data


  api:
    ports:
      - "127.0.0.1:3101:3000"

  keycloak:
    ports:
      - "127.0.0.1:3102:8080"

  meilisearch:
    ports:
      - "127.0.0.1:3103:7700"
    volumes:
      - /srv/kurvenfunk/dev/meilisearch:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:7700/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - /srv/kurvenfunk/dev/minio:/data
    ports:
      - "127.0.0.1:3105:9000"
      - "127.0.0.1:3106:9001"
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

x-kurvenfunk-environment:
  name: development
  env_file: .env.dev
