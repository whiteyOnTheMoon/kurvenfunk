name: kurvenfunk-staging

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - frontend
      - backend
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    volumes:
      - /srv/kurvenfunk/staging/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - /srv/kurvenfunk/staging/redis:/data

  keycloak:
    command:
      - start
    environment:
      KC_HOSTNAME: https://auth-staging.kurvenfunk.at
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

  meilisearch:
    volumes:
      - /srv/kurvenfunk/staging/meilisearch:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - /srv/kurvenfunk/staging/minio:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

x-kurvenfunk-environment:
  name: staging
  env_file: .env.staging
