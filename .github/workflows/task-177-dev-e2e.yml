name: Task 177 - isolated DEV E2E acceptance

on:
  push:
    branches:
      - diag/task-177-dev-e2e

permissions:
  contents: read

concurrency:
  group: task-177-dev-e2e-acceptance
  cancel-in-progress: false

jobs:
  validate:
    name: Validate DEV E2E harness (no environment changes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m py_compile tests/e2e/task-177-dev.py

  run-e2e:
    if: contains(github.event.head_commit.message, '[RUN_TASK_177_E2E]')
    needs: [validate]
    name: Test Task 177 against dedicated DEV identities only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Configure existing DEV-only SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run full direct red-card DEV E2E without disclosing credentials
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -T \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' < tests/e2e/task-177-dev.py
