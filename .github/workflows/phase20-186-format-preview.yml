name: Phase20-186 temporary Prettier preview

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Preview formatted synthetic DEV script as base64
        run: |
          set -Eeuo pipefail
          echo P186_FORMAT_START
          pnpm exec prettier infrastructure/scripts/verify/dev-phase20-session-revoke.mjs | base64 -w0
          echo
          echo P186_FORMAT_END
