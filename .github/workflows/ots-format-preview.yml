name: Temporary OTS formatter preview
on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/ots-format-preview.yml'
      - 'apps/worker/src/providers/ots-news-provider.ts'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Print exact formatted provider
        run: |
          pnpm exec prettier --write apps/worker/src/providers/ots-news-provider.ts
          echo KURVENFUNK_FORMATTED_BEGIN
          base64 -w0 apps/worker/src/providers/ots-news-provider.ts
          echo
          echo KURVENFUNK_FORMATTED_END
