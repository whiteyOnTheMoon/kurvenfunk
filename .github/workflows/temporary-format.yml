name: Temporary auth browser diagnostics formatting
on:
  push:
    branches:
      - 'fix/phase12-keycloak-token-refresh-20261103'
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[RUN_AUTH_FORMAT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'fix/phase12-keycloak-token-refresh-20261103'
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/test/keycloak-login.browser.cjs
      - name: Commit approved formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/test/keycloak-login.browser.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'style(auth): align browser diagnostics with Prettier'
            git push origin HEAD:fix/phase12-keycloak-token-refresh-20261103
          fi
