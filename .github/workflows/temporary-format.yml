name: Temporary one-shot Prettier (MEDIA)
on:
  push:
    branches:
      - 'fix/phase17-safe-image-decoding-20261103'
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[RUN_MEDIA_FORMAT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'fix/phase17-safe-image-decoding-20261103'
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Prettier only approved files
        run: pnpm exec prettier --write 'apps/api/src/modules/media/image-validation.ts' 'apps/api/src/modules/media/image-validation.spec.ts' 'apps/api/src/infrastructure/storage/s3-storage.service.spec.ts' 'apps/api/src/modules/media/media.service.ts' 'apps/api/src/modules/media/media.service.spec.ts'
      - name: Commit formatted files back to this PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'apps/api/src/modules/media/image-validation.ts' 'apps/api/src/modules/media/image-validation.spec.ts' 'apps/api/src/infrastructure/storage/s3-storage.service.spec.ts' 'apps/api/src/modules/media/media.service.ts' 'apps/api/src/modules/media/media.service.spec.ts'
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply one-shot Prettier formatting'
            git push origin HEAD:fix/phase17-safe-image-decoding-20261103
          fi
