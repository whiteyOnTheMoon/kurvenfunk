name: Task 176 - DEV identity diagnostics (read-only)

on:
  push:
    branches:
      - diag/task-176-dev-accounts

permissions:
  contents: read

concurrency:
  group: task-176-dev-identity-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only DEV identity and user mapping checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure existing DEV SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


      - name: Check exact DEV test identities and OAuth clients (read-only)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -T -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import json, os, subprocess, urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          root=Path('/home/ap/www/kurvenfunk')
          assert os.geteuid()!=0 and os.environ.get('USER')=='ap','Wrong user'
          def run(args, **kwargs):
              return subprocess.check_output(args, cwd=root, text=True, **kwargs).strip()
          assert run(['git','branch','--show-current'])=='develop'
          assert run(['git','rev-parse','HEAD'])=='3c6289cfca8fc8032980b1f94d63f3fd3900036b'
          assert not run(['git','status','--porcelain'])
          envlines=(root/'.env.dev').read_text().splitlines()
          def value(key):
              found=[x.split('=',1)[1].strip().strip('"').strip("'") for x in envlines if x.startswith(key+'=')]
              assert len(found)==1 and found[0], 'Missing DEV admin setting '+key
              return found[0]
          adminuser=value('KEYCLOAK_CONFIG_ADMIN_USERNAME')
          adminpass=value('KEYCLOAK_CONFIG_ADMIN_PASSWORD')
          compose=['docker','compose','-p','kurvenfunk-dev','--env-file','.env.dev','-f','compose.yml','-f','compose.dev.yml']
          for service in ('api','postgres','keycloak'):
              cid=run(compose+['ps','-q',service])
              assert cid and run(['docker','inspect','--format','{{index .Config.Labels "com.docker.compose.project"}}',cid])=='kurvenfunk-dev','Wrong DEV container'
          def call(method, uri, token=None, data=None):
              hdr={'authorization':'Bearer '+token} if token else {}
              if data is not None: hdr['content-type']='application/x-www-form-urlencoded'
              try:
                  req=urllib.request.Request('http://127.0.0.1:3102'+uri,headers=hdr,data=data,method=method)
                  with urllib.request.urlopen(req,timeout=10) as response:
                      return response.status,response.read()
              except urllib.error.HTTPError as err:
                  return err.code,b''
          data=urllib.parse.urlencode({'grant_type':'password','client_id':'admin-cli','username':adminuser,'password':adminpass}).encode()
          status,body=call('POST','/realms/master/protocol/openid-connect/token',data=data)
          assert status==200,'Persistent DEV administrator is not authenticated'
          token=json.loads(body)['access_token']
          print('DEV_PERSISTENT_ADMIN: AUTHENTICATED')
          accounts=[
              ('target','e2e-176-target@dev.kurvenfunk.invalid'),
              ('moderator','e2e-176-moderator@dev.kurvenfunk.invalid'),
          ]
          identities=[]
          for label,email in accounts:
              path='/admin/realms/kurvenfunk/users?'+urllib.parse.urlencode({'email':email,'exact':'true','max':'20'})
              st,body=call('GET',path,token)
              assert st==200,'DEV Keycloak user search failed'
              matches=[x for x in json.loads(body) if x.get('email','').lower()==email]
              print('DEV_TEST_EMAIL_MATCHES:',label,len(matches))
              assert len(matches)==1,'Expected exactly one E2E identity'
              account=matches[0]
              assert account.get('username','').lower()==email,'Unexpected Keycloak username'
              assert account.get('enabled') is True,'Test account disabled'
              assert account.get('emailVerified') is True,'Test account email unverified'
              identities.append(account['id'])
          for client_name in ('kurvenfunk-web','admin-cli','kurvenfunk-task-176-e2e'):
              path='/admin/realms/kurvenfunk/clients?'+urllib.parse.urlencode({'clientId':client_name})
              st,body=call('GET',path,token)
              print('DEV_CLIENT_LOOKUP_HTTP:',client_name,st)
              assert st==200,'Client lookup denied'
              clients=[x for x in json.loads(body) if x.get('clientId')==client_name]
              print('DEV_CLIENT_MATCHES:',client_name,len(clients))
              if len(clients)==1:
                  print('DEV_CLIENT_DIRECT_GRANTS:',client_name,clients[0].get('directAccessGrantsEnabled'))
                  print('DEV_CLIENT_PUBLIC:',client_name,clients[0].get('publicClient'))
          for service,cmd in [
              ('api','node -e "console.log(\'DEV_API_OIDC:\', process.env.KEYCLOAK_ISSUER?.includes(\'auth-dev.kurvenfunk.at\') && process.env.KEYCLOAK_AUDIENCE===\'kurvenfunk-api\')"')
          ]:
              print(run(compose+['exec','-T',service,'sh','-lc',cmd]))
          print('TASK_176_TEST_IDENTITIES_AND_OAUTH: VERIFIED_READ_ONLY')
          PY
