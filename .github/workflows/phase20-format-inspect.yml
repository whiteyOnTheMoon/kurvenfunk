name: Phase 20 temporary formatting inspection

on:
  push:
    branches:
      - test/phase20-limited-expiry-http-e2e

permissions:
  contents: read

jobs:
  show-prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Emit formatted test for review
        run: |
          echo PHASE20_FORMAT_START
          pnpm exec prettier apps/api/test/phase20-sanctions.e2e-spec.ts | base64 -w0
          echo
          echo PHASE20_FORMAT_END
