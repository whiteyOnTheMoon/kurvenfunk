name: Task 185 temporary formatting preview

on:
  push:
    branches:
      - feat/phase20-185-red-card-ip-protection
    paths:
      - .github/workflows/phase20-185-format-preview.yml

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format new source files for reviewed application
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/bans/red-card-ip-protection.service.ts \
            apps/api/src/modules/bans/red-card-ip-protection.controller.spec.ts \
            apps/api/test/phase20-red-card-ip-protection.e2e-spec.ts
      - name: Print formatted source encodings to restricted workflow log
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of [
            'apps/api/src/modules/bans/red-card-ip-protection.service.ts',
            'apps/api/src/modules/bans/red-card-ip-protection.controller.spec.ts',
            'apps/api/test/phase20-red-card-ip-protection.e2e-spec.ts',
          ]) {
            console.log('FORMATTED_FILE ' + file + ' ' + fs.readFileSync(file).toString('base64'));
          }
          NODE
