name: Phase 20 - temporary Prettier repair

on:
  push:
    branches:
      - feat/phase20-limited-expiration

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[PHASE20_FORMAT]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase20-limited-expiration
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format only Phase 20 changed source and tests
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/api/src/modules/auth/account-status.guard.ts \
            apps/api/src/modules/auth/account-status.guard.spec.ts \
            apps/api/src/modules/permissions/permissions.service.spec.ts \
            apps/api/src/modules/sanctions/limited-sanctions.controller.ts \
            apps/api/src/modules/sanctions/limited-sanctions.controller.spec.ts \
            apps/api/src/modules/sanctions/limited-sanctions.service.ts \
            apps/api/src/modules/sanctions/limited-sanctions.service.spec.ts \
            apps/api/src/modules/sanctions/sanctions.module.ts \
            apps/web/src/app/login/login-client.tsx \
            apps/worker/src/jobs/sanction-expiration.service.ts \
            apps/worker/src/jobs/sanction-expiration.service.spec.ts \
            apps/worker/src/app.module.ts
          git diff --check
      - name: Commit formatting only to this feature branch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/modules/auth/account-status.guard.ts \
            apps/api/src/modules/auth/account-status.guard.spec.ts \
            apps/api/src/modules/permissions/permissions.service.spec.ts \
            apps/api/src/modules/sanctions/limited-sanctions.controller.ts \
            apps/api/src/modules/sanctions/limited-sanctions.controller.spec.ts \
            apps/api/src/modules/sanctions/limited-sanctions.service.ts \
            apps/api/src/modules/sanctions/limited-sanctions.service.spec.ts \
            apps/api/src/modules/sanctions/sanctions.module.ts \
            apps/web/src/app/login/login-client.tsx \
            apps/worker/src/jobs/sanction-expiration.service.ts \
            apps/worker/src/jobs/sanction-expiration.service.spec.ts \
            apps/worker/src/app.module.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(phase20): format LIMITED and expiration source"
            git push origin HEAD:refs/heads/feat/phase20-limited-expiration
          fi
