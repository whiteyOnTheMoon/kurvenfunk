name: Temporary media formatting preview
on:
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/media-format-preview.yml'
      - 'apps/api/src/modules/media/image-validation.spec.ts'
      - 'apps/api/test/media-upload.e2e-spec.ts'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output for two media test files
        run: |
          pnpm exec prettier --write apps/api/src/modules/media/image-validation.spec.ts apps/api/test/media-upload.e2e-spec.ts
          for file in apps/api/src/modules/media/image-validation.spec.ts apps/api/test/media-upload.e2e-spec.ts; do
            echo "KURVENFUNK_FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "KURVENFUNK_FORMATTED_END:$file"
          done
