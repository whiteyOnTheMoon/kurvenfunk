name: Chromium community UI regression

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/web/src/features/articles/**'
      - 'apps/web/test/phase19-community.browser.cjs'
      - 'apps/web/test/phase19-community-browser-harness.tsx'
      - '.github/workflows/phase19-community-browser.yml'

permissions:
  contents: read

jobs:
  browser-community:
    name: Real Chromium voting/report UI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright Chromium + esbuild
        run: |
          npm install --prefix "$RUNNER_TEMP/kurvenfunk-browser" --no-save --ignore-scripts playwright@1.55.1 esbuild@0.25.12
          node "$RUNNER_TEMP/kurvenfunk-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise voting and reports in Chromium
        env:
          PLAYWRIGHT_MODULE_DIR: ${{ runner.temp }}/kurvenfunk-browser/node_modules
        run: node apps/web/test/phase19-community.browser.cjs
