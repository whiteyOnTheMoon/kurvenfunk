name: Phase20-189 temporary read-only Prettier preview

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Preview formatted files as base64 without writing to repository
        run: |
          set -Eeuo pipefail
          for path in ".github/workflows/ci.yml" "apps/api/src/modules/appeals/appeals.controller.ts" "apps/api/src/modules/appeals/appeals.service.spec.ts" "apps/api/src/modules/appeals/appeals.service.ts" "apps/api/test/phase20-appeals.e2e-spec.ts" "apps/web/src/app/appeals/appeals-client.tsx" "apps/web/src/app/appeals/appeals.module.css" "apps/web/src/app/login/login-client.tsx" "apps/web/src/features/admin/moderation/moderation-appeals.tsx"; do
            echo "P189_BEGIN $path"
            pnpm exec prettier "$path" | base64 -w0
            echo
            echo "P189_END $path"
          done
