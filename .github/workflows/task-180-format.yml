name: Task 180 - one-shot formatting
on:
  push:
    branches:
      - feat/phase20-banned-handling
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[RUN_180_FORMAT]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase20-banned-handling
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/api/src/modules/auth/account-status.guard.ts \
            apps/api/src/modules/auth/account-status.guard.spec.ts \
            apps/web/src/app/login/login-client.tsx
          git diff --check
      - run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/src/modules/auth/account-status.guard.ts apps/api/src/modules/auth/account-status.guard.spec.ts apps/web/src/app/login/login-client.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(task-180): apply Prettier to banned status handling"
            git push origin HEAD:refs/heads/feat/phase20-banned-handling
          fi
