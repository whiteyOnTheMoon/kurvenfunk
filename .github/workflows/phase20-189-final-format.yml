name: Phase20-189 final React Prettier preview

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Read-only exact Prettier preview
        run: |
          set -Eeuo pipefail
          for path in "apps/web/src/app/appeals/appeals-client.tsx" "apps/web/src/features/admin/moderation/moderation-appeals.tsx"; do
            echo "P189_FINAL_BEGIN $path"
            pnpm exec prettier "$path" | base64 -w0
            echo
            echo "P189_FINAL_END $path"
          done
