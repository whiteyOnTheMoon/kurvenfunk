name: Phase 20 - one-shot formatting
on:
  push:
    branches:
      - feat/phase20-limited-and-expiration

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[RUN_PHASE20_FORMAT]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase20-limited-and-expiration
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format changed Phase 20 source and tests only
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/api/src/modules/sanctions/limited-sanctions.controller.ts \
            apps/api/src/modules/sanctions/limited-sanctions.controller.spec.ts \
            apps/api/src/modules/sanctions/limited-sanctions.service.ts \
            apps/api/src/modules/sanctions/limited-sanctions.service.spec.ts \
            apps/api/src/modules/sanctions/sanctions.module.ts \
            apps/api/src/modules/permissions/permissions.constants.ts \
            apps/api/src/modules/permissions/permissions.service.spec.ts \
            apps/worker/src/app.module.ts \
            apps/worker/src/services/sanction-expiration.service.ts \
            apps/worker/src/services/sanction-expiration.service.spec.ts
          git diff --check
      - name: Commit formatting to the feature branch only
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/modules/sanctions \
            apps/api/src/modules/permissions/permissions.constants.ts \
            apps/api/src/modules/permissions/permissions.service.spec.ts \
            apps/worker/src/app.module.ts \
            apps/worker/src/services/sanction-expiration.service.ts \
            apps/worker/src/services/sanction-expiration.service.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(phase20): apply Prettier to LIMITED and expiration worker"
            git push origin HEAD:refs/heads/feat/phase20-limited-and-expiration
          fi
