name: Task 184 PR-only Prettier correction
on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]
permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.number == 97 &&
      github.event.pull_request.head.ref == 'feat/phase20-184-manual-ip-ban' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase20-184-manual-ip-ban
          persist-credentials: true
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format only Task 184 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/bans/manual-ip-ban.controller.ts \
            apps/api/src/modules/bans/temporary-ip-block.service.ts \
            apps/api/src/modules/bans/temporary-ip-block.service.spec.ts \
            apps/api/test/phase20-manual-ip-ban.e2e-spec.ts
      - name: Push only formatting changes to the same PR branch
        run: |
          set -Eeuo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add -- \
              apps/api/src/modules/bans/manual-ip-ban.controller.ts \
              apps/api/src/modules/bans/temporary-ip-block.service.ts \
              apps/api/src/modules/bans/temporary-ip-block.service.spec.ts \
              apps/api/test/phase20-manual-ip-ban.e2e-spec.ts
            git commit -m 'style(phase20.184): apply repository Prettier'
            git push origin HEAD:refs/heads/feat/phase20-184-manual-ip-ban
          fi
