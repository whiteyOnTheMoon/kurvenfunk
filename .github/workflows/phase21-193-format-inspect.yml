name: Phase 21.193 temporary format inspect

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  inspect:
    if: startsWith(github.head_ref, 'feature/phase21-193-season-management')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write apps/api/test/phase21-season-management.e2e-spec.ts
          git diff --no-ext-diff -- apps/api/test/phase21-season-management.e2e-spec.ts
