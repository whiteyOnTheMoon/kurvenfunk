name: Phase21-197 formatting snapshot

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  inspect:
    if: startsWith(github.head_ref, 'feature/phase21-197-standings')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format and display exact base64 output
        run: |
          for file in \
            packages/validation/src/standing-management.ts \
            packages/validation/src/standing-management.spec.ts \
            apps/api/src/modules/standings/standing-management.controller.ts \
            apps/api/src/modules/standings/standing-management.service.ts \
            apps/api/test/phase21-standings.e2e-spec.ts \
            apps/web/src/features/admin/standings/standing-admin.tsx \
            apps/web/src/features/admin/standings/standing-admin.module.css \
            docs/product/phase21-197-standings.md
          do
            pnpm exec prettier --write "$file" 1>/dev/null
            echo "KF_FORMAT_START $file"
            base64 -w 76 "$file"
            echo "KF_FORMAT_END $file"
          done
