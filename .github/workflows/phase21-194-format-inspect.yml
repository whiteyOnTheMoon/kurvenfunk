name: Phase21-194 formatting snapshot

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  inspect:
    if: startsWith(github.head_ref, 'feature/phase21-194-club-management')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format and display exact base64 output
        run: |
          for file in \
            apps/api/src/modules/clubs/clubs.service.ts \
            apps/api/test/phase21-club-management.e2e-spec.ts \
            apps/web/src/features/admin/clubs/club-admin.tsx \
            packages/validation/src/club-management.ts
          do
            pnpm exec prettier --write "$file" 1>/dev/null
            echo "KF_FORMAT_START $file"
            base64 -w 76 "$file"
            echo "KF_FORMAT_END $file"
          done
