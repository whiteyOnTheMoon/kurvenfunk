name: CI
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Format, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      NODE_ENV: production
      WEB_URL: https://ci.kurvenfunk.invalid
      API_URL: https://api-ci.kurvenfunk.invalid
      AUTH_URL: https://auth-ci.kurvenfunk.invalid
      DATABASE_URL: postgresql://kurvenfunk:kurvenfunk@localhost:5432/kurvenfunk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Show versions
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "head_ref=${{ github.head_ref }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "checked_out=$(git rev-parse HEAD)"
          node --version
          pnpm --version
          sha256sum apps/web/src/components/layout/app-shell.tsx

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Validate DEV deploy script syntax
        run: |
          bash -n infrastructure/scripts/deploy/dev.sh
          bash -n infrastructure/scripts/verify/dev-ots-import.sh
          bash -n infrastructure/scripts/verify/dev-editorial-readonly.sh
          bash -n infrastructure/scripts/verify/dev-phase17-accounts.sh
          bash -n infrastructure/scripts/verify/dev-phase19-moderator.sh
          bash -n infrastructure/scripts/verify/dev-phase20-limited.sh
          node --check infrastructure/scripts/verify/dev-phase20-limited.mjs
          bash -n infrastructure/scripts/verify/dev-phase20-matrix.sh
          node --check infrastructure/scripts/verify/dev-phase20-matrix.mjs
          bash -n infrastructure/scripts/verify/dev-phase20-banned.sh
          node --check infrastructure/scripts/verify/dev-phase20-banned.mjs
          bash -n infrastructure/scripts/verify/dev-phase20-ip-hashing.sh
          bash -n infrastructure/scripts/verify/dev-phase20-ip-rate-limits.sh
          node --check infrastructure/scripts/maintenance/prune-merged-branches.mjs

      - name: Generate Prisma client
        run: pnpm --filter=@kurvenfunk/database generate

      - name: Build shared packages
        run: pnpm turbo build --filter=@kurvenfunk/logger --filter=@kurvenfunk/types --filter=@kurvenfunk/database --filter=@kurvenfunk/validation

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

  deploy-dev:
    name: Deploy DEV
    needs:
      - ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' ./infrastructure/scripts/deploy/dev.sh"

      - name: Verify DEV editorial runtime (read-only)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-editorial-readonly.sh"

      - name: Inspect DEV Phase 17 test account state (read-only)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase17-accounts.sh inspect"

      - name: Inspect DEV Phase 19 moderator test account (read-only)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase19-moderator.sh inspect"

  verify-dev-ots:
    name: Verify DEV APA-OTS imports (read-only, acceptance)
    needs:
      - deploy-dev

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    # The external APA feed may be temporarily unavailable. Keep this
    # operational check independent of CI and the already deployed app.
    continue-on-error: true

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect APA-OTS scheduler and import safety on DEV
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-ots-import.sh"

  deploy-staging:
    name: Deploy STAGING
    needs:
      - ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_staging
          chmod 600 ~/.ssh/kurvenfunk_staging

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_staging \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk-staging && EXPECTED_COMMIT='$EXPECTED_COMMIT' ./infrastructure/scripts/deploy/staging.sh"

  docker-worker-build:
    name: Worker Docker build (Prisma schema)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build worker image from fresh Prisma schema
        run: docker build --file apps/worker/Dockerfile --tag kurvenfunk-worker:ci .
      - name: Build Prisma migration image
        run: docker build --file infrastructure/docker/migrate/Dockerfile --tag kurvenfunk-migrate:ci .

  e2e-isolated:
    name: Isolated API HTTP E2E (PostgreSQL, Redis, signed JWT)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - ci
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated API E2E
        run: pnpm --filter api test:e2e

  phase20-178-dev-http:
    name: Task 178 real DEV Keycloak HTTP acceptance (synthetic users)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-178-dev-http]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: phase20-178-dev-http
      cancel-in-progress: false
    steps:
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Exercise LIMITED sanction with fresh DEV Keycloak users
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase20-limited.sh"

  phase20-179-dev-http:
    name: Task 179 real DEV LIMITED matrix acceptance (synthetic users)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-179-dev-http]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: phase20-179-dev-http
      cancel-in-progress: false
    steps:
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check LIMITED reads and writes with fresh DEV Keycloak users
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase20-matrix.sh"

  phase20-180-dev-http:
    name: Task 180 real DEV BANNED handling acceptance (synthetic users)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-180-dev-http]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: phase20-180-dev-http
      cancel-in-progress: false
    steps:
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Exercise red-card ban, session revoke and BANNED access denial on DEV
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase20-banned.sh"

  phase20-181-dev-hmac:
    name: Task 181 DEV HMAC runtime verification (ephemeral keys only)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-181-dev-hmac]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: phase20-181-dev-hmac
      cancel-in-progress: false
    steps:
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify compiled HMAC service without storing any IP address
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase20-ip-hashing.sh"

  phase20-182-dev-api:
    name: Task 182 DEV API rate-limit smoke (synthetic Redis data)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-182-dev-api]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: phase20-182-dev-api
      cancel-in-progress: false
    steps:
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check API Redis counter and proxy identity safely on DEV
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase20-ip-rate-limits.sh"

  prune-merged-branches:
    name: Remove safely verifiable obsolete PR branches
    needs:
      - deploy-dev
      - phase20-182-dev-api
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-182-cleanup]') &&
      needs.phase20-182-dev-api.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v7
      - name: Prune only unchanged heads of merged PRs, preserving unmerged work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: node infrastructure/scripts/maintenance/prune-merged-branches.mjs
