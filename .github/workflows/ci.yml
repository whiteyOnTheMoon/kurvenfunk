name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      NODE_ENV: production
      WEB_URL: https://ci.kurvenfunk.invalid
      API_URL: https://api-ci.kurvenfunk.invalid
      AUTH_URL: https://auth-ci.kurvenfunk.invalid
      DATABASE_URL: postgresql://kurvenfunk:kurvenfunk@localhost:5432/kurvenfunk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Show versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=@kurvenfunk/database generate

      - name: Build shared packages
        run: pnpm turbo build --filter=@kurvenfunk/logger --filter=@kurvenfunk/types --filter=@kurvenfunk/database

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

  deploy-dev:
    name: Deploy DEV
    needs:
      - ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' ./infrastructure/scripts/deploy/dev.sh"

  deploy-staging:
    name: Deploy STAGING
    needs:
      - ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_staging
          chmod 600 ~/.ssh/kurvenfunk_staging

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_staging \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk-staging && EXPECTED_COMMIT='$EXPECTED_COMMIT' ./infrastructure/scripts/deploy/staging.sh"
