name: CI
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Format, Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    env:
      NODE_ENV: production
      WEB_URL: https://ci.kurvenfunk.invalid
      API_URL: https://api-ci.kurvenfunk.invalid
      AUTH_URL: https://auth-ci.kurvenfunk.invalid
      DATABASE_URL: postgresql://kurvenfunk:kurvenfunk@localhost:5432/kurvenfunk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Show versions
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "head_ref=${{ github.head_ref }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "checked_out=$(git rev-parse HEAD)"
          node --version
          pnpm --version
          sha256sum apps/web/src/components/layout/app-shell.tsx

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Validate DEV deploy script syntax
        run: |
          bash -n infrastructure/scripts/deploy/dev.sh
          bash -n infrastructure/scripts/verify/dev-ots-import.sh
          bash -n infrastructure/scripts/verify/dev-editorial-readonly.sh
          bash -n infrastructure/scripts/verify/dev-phase17-accounts.sh
          bash -n infrastructure/scripts/verify/dev-phase19-moderator.sh
          bash -n infrastructure/scripts/verify/dev-phase20-limited.sh
          node --check infrastructure/scripts/verify/dev-phase20-limited.mjs
          bash -n infrastructure/scripts/verify/dev-phase20-matrix.sh
          node --check infrastructure/scripts/verify/dev-phase20-matrix.mjs
          bash -n infrastructure/scripts/verify/dev-phase20-banned.sh
          node --check infrastructure/scripts/verify/dev-phase20-banned.mjs
          bash -n infrastructure/scripts/verify/dev-phase20-session-revoke.sh
          node --check infrastructure/scripts/verify/dev-phase20-session-revoke.mjs
          bash -n infrastructure/scripts/verify/dev-phase20-ip-hashing.sh
          bash -n infrastructure/scripts/verify/dev-phase20-ip-rate-limits.sh
          bash -n infrastructure/scripts/verify/dev-phase20-free-gateway.sh
          bash -n infrastructure/scripts/keycloak/configure-email-registration.sh
          bash -n infrastructure/scripts/keycloak/configure-transactional-email.sh
          node --check infrastructure/scripts/keycloak/smtp-config.mjs
          node --test infrastructure/scripts/keycloak/smtp-config.test.mjs
          bash -n infrastructure/scripts/keycloak/apply-dev-branding.sh
          node --test infrastructure/scripts/keycloak/branding.test.mjs
          bash -n infrastructure/scripts/verify/dev-phase20-182-free-live.sh
          bash -n infrastructure/scripts/verify/dev-phase20-182-api-activate.sh
          bash -n infrastructure/scripts/verify/dev-phase20-182-final-preflight.sh
          bash -n infrastructure/scripts/verify/dev-phase20-183-smoke.sh
          bash -n infrastructure/scripts/verify/dev-phase20-184-smoke.sh
          bash -n infrastructure/scripts/verify/dev-phase20-185-smoke.sh
          bash -n infrastructure/scripts/verify/dev-phase20-187-dashboard.sh
          bash -n infrastructure/scripts/verify/dev-phase20-188-history.sh
          bash -n infrastructure/scripts/verify/dev-phase20-189-appeals.sh
          bash -n infrastructure/scripts/verify/dev-phase20-190-four-eyes.sh
          bash -n infrastructure/scripts/verify/dev-phase20-191-worker.sh
          bash -n infrastructure/scripts/verify/phase20-182-isolated.sh
          node --check infrastructure/tests/phase20-182-mock-keycloak.mjs
          node --check infrastructure/scripts/verify/phase20-182-isolated-http.mjs
          node --check infrastructure/scripts/verify/phase20-182-public-quotas.mjs
          node --check infrastructure/scripts/verify/phase20-182-public-edge.mjs
          node --check infrastructure/scripts/maintenance/prune-merged-branches.mjs
          bash -n infrastructure/scripts/verify/dev-phase0-21-data-audit.sh
          node --check infrastructure/scripts/verify/dev-phase0-21-data-audit.mjs
          node --test infrastructure/scripts/verify/phase0-21-data-audit.test.mjs
          bash -n infrastructure/scripts/verify/dev-residual-services-readonly.sh
          bash -n infrastructure/scripts/verify/dev-keycloak-admin-readonly.sh
          node --test infrastructure/scripts/verify/dev-keycloak-admin-readonly.test.mjs
          bash -n infrastructure/scripts/maintenance/dev-residual-reset.sh
          bash -n infrastructure/scripts/maintenance/dev-residual-clear-keycloak.sh
          node --check infrastructure/scripts/maintenance/dev-residual-clear-media.mjs
          node --test infrastructure/scripts/maintenance/dev-residual-reset.test.mjs
          python3 -c 'import ast,pathlib;ast.parse(pathlib.Path("infrastructure/scripts/maintenance/dev-residual-clear-http.py").read_text())'
          bash -n infrastructure/scripts/maintenance/dev-full-app-reset.sh
          node --test infrastructure/scripts/maintenance/dev-full-app-reset.test.mjs
          bash -n infrastructure/scripts/maintenance/dev-phase0-21-synthetic-cleanup.sh
          node --check infrastructure/scripts/maintenance/dev-phase0-21-synthetic-cleanup.mjs
          node --test infrastructure/scripts/maintenance/dev-phase0-21-synthetic-cleanup.test.mjs
          bash -n infrastructure/scripts/verify/dev-phase21-seed-audit.sh
          bash -n infrastructure/scripts/maintenance/dev-phase21-seed-cleanup.sh
          node --check infrastructure/scripts/maintenance/dev-phase21-seed-cleanup.mjs
          node --test infrastructure/scripts/maintenance/phase21-seed-cleanup.test.mjs
          node --check infrastructure/scripts/verify/dev-phase21-seed-audit.mjs
          node --test infrastructure/scripts/verify/phase21-no-dev-seed.test.mjs
          node --check infrastructure/scripts/cloudflare/phase20-182-keycloak-ratelimit.mjs
          node --test infrastructure/scripts/cloudflare/phase20-182-keycloak-ratelimit.test.mjs

      - name: Generate Prisma client
        run: pnpm --filter=@kurvenfunk/database generate

      - name: Build shared packages
        run: pnpm turbo build --filter=@kurvenfunk/logger --filter=@kurvenfunk/types --filter=@kurvenfunk/database --filter=@kurvenfunk/validation

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

  deploy-dev:
    name: Deploy DEV
    needs:
      - ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' ./infrastructure/scripts/deploy/dev.sh"

      - name: Verify DEV editorial runtime (read-only)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-editorial-readonly.sh"

      - name: Inspect DEV Phase 17 test account state (read-only)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase17-accounts.sh inspect"

      - name: Inspect DEV Phase 19 moderator test account (read-only)
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase19-moderator.sh inspect"

  verify-dev-ots:
    name: Verify DEV APA-OTS imports (read-only, acceptance)
    needs:
      - deploy-dev

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    # The external APA feed may be temporarily unavailable. Keep this
    # operational check independent of CI and the already deployed app.
    continue-on-error: true

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect APA-OTS scheduler and import safety on DEV
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/kurvenfunk_dev \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-ots-import.sh"

  apply-dev-keycloak-branding:
    name: Apply branded DEV Keycloak login theme (safe rollback)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[auth-dev-branding-apply]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: dev-keycloak-branding
      cancel-in-progress: false
    steps:
      - name: Configure DEV SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Activate and audit DEV login branding
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/keycloak/apply-dev-branding.sh"

  deploy-staging:
    name: Deploy STAGING
    needs:
      - ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_staging
          chmod 600 ~/.ssh/kurvenfunk_staging

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy tested commit
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/kurvenfunk_staging \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk-staging && EXPECTED_COMMIT='$EXPECTED_COMMIT' ./infrastructure/scripts/deploy/staging.sh"

  phase21-201-real-queue:
    name: Phase 21.201 real worker + Redis + PostgreSQL queue acceptance
    if: github.event_name == 'pull_request'
    needs:
      - ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Isolated CI containers, never DEV or production credentials.
      DATABASE_URL: postgresql://sports_ci:sports_ci@127.0.0.1:55432/sports_ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '56379'
      REDIS_PASSWORD: sports_ci_only
      NODE_ENV: test
      SPORTS_FAKE_PROVIDER_ENABLED: 'true'
      SPORTS_IMPORT_SCHEDULER_ENABLED: 'false'
      SPORTS_IMPORT_LIVE_ENABLED: 'false'
      NEWS_IMPORT_SCHEDULER_ENABLED: 'false'
      WORKER_RUN_STARTUP_TEST: 'false'
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run true queue acceptance with ephemeral databases
        run: |
          set -Eeuo pipefail
          docker run -d --rm --name kf-sports-ci-postgres \
            -e POSTGRES_DB=sports_ci -e POSTGRES_USER=sports_ci -e POSTGRES_PASSWORD=sports_ci \
            -p 127.0.0.1:55432:5432 postgres:17-alpine >/dev/null
          docker run -d --rm --name kf-sports-ci-redis \
            -p 127.0.0.1:56379:6379 redis:7.4-alpine \
            redis-server --requirepass sports_ci_only --save "" >/dev/null
          cleanup() {
            docker rm -f kf-sports-ci-postgres kf-sports-ci-redis >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if docker exec kf-sports-ci-postgres pg_isready -h 127.0.0.1 -U sports_ci -d sports_ci >/dev/null 2>&1 &&
               docker exec kf-sports-ci-redis redis-cli -a sports_ci_only ping 2>/dev/null | grep -q PONG; then
              break
            fi
            sleep 1
          done
          docker exec kf-sports-ci-postgres pg_isready -h 127.0.0.1 -U sports_ci -d sports_ci
          docker exec kf-sports-ci-redis redis-cli -a sports_ci_only ping 2>/dev/null | grep -q PONG
          pnpm --filter=@kurvenfunk/database generate
          pnpm turbo build --filter=@kurvenfunk/logger --filter=@kurvenfunk/types --filter=@kurvenfunk/database
          pnpm --filter @kurvenfunk/database exec prisma migrate deploy
          pnpm --filter worker build
          pnpm --filter worker exec node test/phase21-201-real-queue.e2e.cjs

  docker-worker-build:
    name: Worker Docker build (Prisma schema)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build worker image from fresh Prisma schema
        run: docker build --file apps/worker/Dockerfile --tag kurvenfunk-worker:ci .
      - name: Build Prisma migration image
        run: docker build --file infrastructure/docker/migrate/Dockerfile --tag kurvenfunk-migrate:ci .

  e2e-isolated:
    name: Isolated API HTTP E2E (PostgreSQL, Redis, signed JWT)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - ci
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated API E2E
        run: pnpm --filter api test:e2e

  phase20-182-isolated-recovery:
    name: Task 182 isolated gateway HTTP quota, Redis outage and recovery
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - ci
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull request commit
        uses: actions/checkout@v7
      - name: Build and test isolated gateway + Redis without DEV impact
        run: bash infrastructure/scripts/verify/phase20-182-isolated.sh

  phase20-182-final-dev:
    name: Task 182 final bounded public DEV 429 acceptance
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-182-final-dev]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: phase20-182-final-dev
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v7
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only verify active DEV gateway and API rate limiter
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase20-182-final-preflight.sh"
      - name: Controlled public login, registration, reset, comments and reports quotas
        run: node infrastructure/scripts/verify/phase20-182-public-quotas.mjs

  phase20-178-dev-http:
    name: Task 178 real DEV Keycloak HTTP acceptance (synthetic users)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-178-dev-http]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: phase20-178-dev-http
      cancel-in-progress: false
    steps:
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Exercise LIMITED sanction with fresh DEV Keycloak users
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase20-limited.sh"

  phase20-179-dev-http:
    name: Task 179 real DEV LIMITED matrix acceptance (synthetic users)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-179-dev-http]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: phase20-179-dev-http
      cancel-in-progress: false
    steps:
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check LIMITED reads and writes with fresh DEV Keycloak users
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/kurvenfunk_dev -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd ~/www/kurvenfunk && EXPECTED_COMMIT='$EXPECTED_COMMIT' bash ./infrastructure/scripts/verify/dev-phase20-matrix.sh"

  phase20-186-dev-session-revoke:
    name: Task 186 DEV real Keycloak PKCE session revocation & recovery (synthetic users)
    needs:
      - deploy-dev
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      contains(github.event.head_commit.message, '[phase20-186-dev-session-revoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: phase20-186-dev-session-revoke
      cancel-in-progress: false
    steps:
      - name: Configure DEV-only SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/kurvenfunk_dev
          chmod 600 ~/.ssh/kurvenfunk_dev
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Exercise red-card ban, session revoke and BANNED access denial on DEV
        env:
          SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.DEV_SSH_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
