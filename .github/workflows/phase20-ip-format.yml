name: Phase 20 - one-shot IP formatting
on:
  push:
    branches:
      - feat/phase20-ip-protection
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[PHASE20_IP_FORMAT]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase20-ip-protection
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Format only Phase 20 IP changes
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/api/src/config/env.validation.ts \
            apps/api/src/modules/bans/ip-block.controller.spec.ts \
            apps/api/src/modules/bans/ip-block.service.spec.ts \
            apps/api/src/modules/bans/ip-block.service.ts \
            apps/api/src/modules/bans/ip-identity.service.spec.ts \
            apps/api/src/modules/bans/ip-identity.service.ts \
            apps/api/src/modules/bans/ip-policy.guard.spec.ts \
            apps/api/src/modules/bans/ip-policy.guard.ts \
            apps/api/src/modules/bans/ip-block.controller.ts \
            apps/api/src/modules/bans/bans.module.ts
          git diff --check
      - name: Commit formatting only to feature branch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/config/env.validation.ts \
            apps/api/src/modules/bans/ip-block.controller.spec.ts \
            apps/api/src/modules/bans/ip-block.service.spec.ts \
            apps/api/src/modules/bans/ip-block.service.ts \
            apps/api/src/modules/bans/ip-identity.service.spec.ts \
            apps/api/src/modules/bans/ip-identity.service.ts \
            apps/api/src/modules/bans/ip-policy.guard.spec.ts \
            apps/api/src/modules/bans/ip-policy.guard.ts \
            apps/api/src/modules/bans/ip-block.controller.ts \
            apps/api/src/modules/bans/bans.module.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(phase20): format IP protection"
            git push origin HEAD:refs/heads/feat/phase20-ip-protection
          fi
