name: Phase20-188 temporary read-only Prettier preview

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Preview formatted files as base64 without writing to repository
        run: |
          set -Eeuo pipefail
          for path in ".github/workflows/ci.yml" "apps/api/src/modules/moderation/user-moderation-history.spec.ts" "apps/api/test/phase20-user-moderation-history.e2e-spec.ts" "apps/web/src/features/admin/moderation/moderation-dashboard.tsx" "apps/web/src/features/admin/moderation/user-moderation-history.module.css" "apps/web/src/features/admin/moderation/user-moderation-history.tsx"; do
            echo "P188_BEGIN $path"
            pnpm exec prettier "$path" | base64 -w0
            echo
            echo "P188_END $path"
          done
