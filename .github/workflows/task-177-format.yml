name: Task 177 - one-shot Prettier repair
on:
  push:
    branches:
      - feat/task-177-direct-red-card

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[RUN_TASK_177_FORMAT]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v7
        with:
          ref: feat/task-177-direct-red-card
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only task 177 source and test files
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/api/src/modules/moderation/moderation.controller.ts \
            apps/api/src/modules/moderation/moderation.controller.spec.ts \
            apps/api/src/modules/moderation/direct-red-card.service.spec.ts
          git diff --check
      - name: Commit formatting to feature branch only
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/modules/moderation/moderation.controller.ts \
            apps/api/src/modules/moderation/moderation.controller.spec.ts \
            apps/api/src/modules/moderation/direct-red-card.service.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(task-177): apply Prettier to direct red-card files"
            git push origin HEAD:refs/heads/feat/task-177-direct-red-card
          fi
