name: Phase20-187 temporary read-only Prettier preview

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Preview formatted files as base64 without writing to repository
        run: |
          set -Eeuo pipefail
          for path in ".github/workflows/ci.yml" "apps/api/src/modules/moderation/moderation-dashboard.service.ts" "apps/api/src/modules/moderation/moderation-dashboard.spec.ts" "apps/api/test/phase20-moderation-dashboard.e2e-spec.ts" "apps/web/src/features/admin/moderation/comment-report-queue.module.css" "apps/web/src/features/admin/moderation/comment-report-queue.tsx" "apps/web/src/features/admin/moderation/moderation-dashboard.tsx"; do
            echo "P187_BEGIN $path"
            pnpm exec prettier "$path" | base64 -w0
            echo
            echo "P187_END $path"
          done
