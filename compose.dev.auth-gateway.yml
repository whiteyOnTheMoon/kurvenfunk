# Opt-in DEV only. Never add this overlay to automatic deployment.
services:
  auth-gateway:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/auth-gateway/main.js']
    working_dir: /app/apps/api
    environment:
      NODE_ENV: production
      AUTH_GATEWAY_PORT: 8080
      AUTH_GATEWAY_UPSTREAM: keycloak
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IP_HASH_HMAC_SECRET: ${IP_HASH_HMAC_SECRET:?DEV_HMAC_SECRET_REQUIRED}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('node:http').get('http://127.0.0.1:8080/_gateway/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    # No published host port. Public tunnel routing is a separate manual gate.
