services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Vienna}
      PGTZ: ${PGTZ:-Europe/Vienna}

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
      args:
        WEB_URL: ${WEB_URL}
        API_URL: ${API_URL}
        AUTH_URL: ${AUTH_URL}
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WEB_URL: ${WEB_URL}
      API_URL: ${API_URL}
      AUTH_URL: ${AUTH_URL}

    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - frontend
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      WEB_URL: ${WEB_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/v1/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/migrate/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - deployment
    restart: 'no'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}

      NEWS_IMPORT_SCHEDULER_ENABLED: ${NEWS_IMPORT_SCHEDULER_ENABLED:-false}
      NEWS_IMPORT_SCHEDULER_INTERVAL_MS: ${NEWS_IMPORT_SCHEDULER_INTERVAL_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node --input-type=module -e "import Redis from 'ioredis';
          const redis = new Redis({
          host: process.env.REDIS_HOST || 'redis',
          port: Number(process.env.REDIS_PORT || 6379),
          password: process.env.REDIS_PASSWORD,
          lazyConnect: true,
          maxRetriesPerRequest: 1
          });
          try {
          await redis.connect();
          const result = await redis.ping();
          await redis.quit();
          process.exit(result === 'PONG' ? 0 : 1);
          } catch {
          redis.disconnect();
          process.exit(1);
          }"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    restart: unless-stopped

    command:
      - start-dev

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "\"status\": \"UP\"" <&3'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - backend

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped

    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:7700/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
