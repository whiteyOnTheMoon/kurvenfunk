name: kurvenfunk-prod

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - frontend
      - backend
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    volumes:
      - /srv/kurvenfunk/prod/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - /srv/kurvenfunk/prod/redis:/data

  keycloak:
    command:
      - start

    environment:
      KC_HOSTNAME: https://auth.kurvenfunk.at
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

  meilisearch:
    ports:
      - "127.0.0.1:3104:7700"
    volumes:
      - /srv/kurvenfunk/prod/meilisearch:/meili_data

x-kurvenfunk-environment:
  name: production
  env_file: .env.prod
